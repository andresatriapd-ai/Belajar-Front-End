<!DOCTYPE html>
<html>
<head>
  <style>
    .menu {
      background: lightyellow;
      padding: 30px;
    }

    .menu > li {

    #logo {
      font-size: 30px;
    }

    input[type="text"] {

  <h1 id="logo">My Website</h1>

  <input type="text" placeholder="Email">

  <button>Kirim</button>

</html>
