<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlentina Design</title>
    <link rel="icon" href="logo.png.png">
    <style>
    body {
        background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(logo1.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        backdrop-filter:blur (30px)

    }

    .marlentina {
          height: 100vh;
      display: flex;
      align-items: center;      /* Tengah secara vertikal */
      justify-content: flex-start; /* Ke kiri */
      padding-left: 50px;
      
      color: white;
      font-size: 30px;
      
      
    }

    button {
        font-size: 30px;
        border-color: black;
        color: white;
        background-color: black;
        border-radius: 30px;
        transition: 0.3s;
        cursor: pointer;

    }
    
    
    button:hover {
        transform:scale(1.1)



    }
    
    
    

    </style>

</head>
<body>
    <!--HEADER -->
    <header>
        <div class="marlentina">
            <div>
              <h1>Marlentina Design</h1>
            <p>Design Ruang Impian Anda</p>
            <button>OPEN</button>
        </div>
        </div>
    </header>

    <!-- SECTION-->
     <!--FOOTER-->
  
    
    
</body>
</html>
