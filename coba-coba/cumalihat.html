<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marlentina Design</title>

<style>
body {
    margin: 0;
    background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(logo1.png);
    background-size: cover;
    background-position: center;
    font-family: Arial;
}

/* NAVBAR */
nav {
    opacity: calc(0.9);
    display: flex;
    justify-content: space-between;
    align-items:center;
    padding: 20px 60px;
    background: rgba(0,0,0,0.5);
}

.logo img {
    height: 60px;
}

/* MENU */
ul {
    display:flex;
    gap: 40px;
    list-style: none;
    font-size: 25px;
}

li a {
    color: white;
    text-decoration: none;
}

nav ul li:hover {
    transform: scale(1.2);
    transition: 0.3s;
}

/* HERO */
.marlentina {
    height: 100vh;
    display: flex;
    align-items: center;
    padding-left: 50px;
    color: white;
    font-size: 40px;
}
#portofolio  {
    opacity: calc(0.8);
    background-color: grey;
    border-radius: 999px;
    display: inline-block;
    padding: 8px 20px;
    
    
}

/* PORTOFOLIO */
.portofolio {
    padding: 80px 20px;
    color: white;
    text-align: center;
    
}

/* CARDS */
section .card:hover {
  background: radial-gradient(circle at center, var(--glow-color), transparent 35%);
  opacity: 0.6;
  transition: transform 300ms ease, opacity 200ms ease;
    background-color: aqua;
    
}
.cards {
    display: flex;
    justify-content: center; /* CENTER */
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
}

/* CARD */
.card {
    
    padding: 30px 40px;
    background: white;
    color: black;
    border-radius: 30px;
    min-width: 150px;

    /* ANIMASI AWAL */
    opacity: 0;
    transform: translateY(50px);
    transition: 0.5s;
}

/* SAAT DIKLIK */
.cards.show .card {
    
    opacity: 1;
    transform: translateY(0);
}

/* DELAY ANIMASI */
.cards.show .card:nth-child(1) {
    transition-delay: 0.2s;
}
.cards.show .card:nth-child(2) {
    transition-delay: 0.4s;
}
.cards.show .card:nth-child(3) {
    transition-delay: 0.6s;
}
 .bawah{
    opacity: calc(0.3);
    background-color: grey;
    padding: 1px;
    text-align: right;
}

#bawahan {
    color: white;
    display: inline-block;
  
}

</style>
</head>

<body>

<header>
<nav>
    <div class="logo">
        <img src="logolentina.png">
    </div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#portofolio" onclick="showPortfolio()">Project</a></li>
        <li><a href="#">About</a></li>
    </ul>
</nav>
</header>

<!-- HERO -->
<section>
<div class="marlentina">
    <div>
        <h1>Marlentina Design</h1>
        <p>Design Ruang Impian Anda</p>
    </div>
</div>
</section>

<!-- PORTOFOLIO -->
<section class="portofolio">
    <h2 id="portofolio">Portofolio</h2>

    <div class="cards" id="cards">
        <div class="card">Room </div>
        <div class="card">Bedroom</div>
        <div class="card">Workspace</div>
    </div>
</section>

<script>
function showPortfolio() {
    document.getElementById("cards").classList.add("show");
}
</script>

<footer>
    <div class="bawah">
       <span> 
        <ion-icon name="logo-whatsapp"></ion-icon>
        <a class="btn-flip" data-back="Share"data-front = "Whatsapp"></a>
       </span>
    </div>
</footer>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
