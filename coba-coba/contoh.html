<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6');
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
    }

    .container {
      height: 100vh;
      display: flex;
      align-items: center;      /* Tengah secara vertikal */
      justify-content: flex-start; /* Ke kiri */
      padding-left: 50px;
      background: rgba(0,0,0,0.4); /* overlay biar teks jelas */
      color: white;
    }

   
    

    p {
      font-size: 18px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background: black;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <h1>Interior Design</h1>
      <p>Desain ruang impian Anda</p>
      <button>Mulai</button>
    </div>
  </div>

</body>
</html>
