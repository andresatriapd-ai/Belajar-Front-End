<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlentina Design</title>
    <link rel="icon" href="logo.png.png">
    <style>
    body {
        background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(logo1.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
    }
    
    
        /*header*/
        
    nav {
        justify-content: right;
        display: flex;
       padding: 20px 60px;
       background: rgba(0,0,0,0.5);
    }
    .logo {
        margin-left: auto;
    }   
   .logo img {
    width: 40px;
    height:90px;

   }



     ul {
        
        font-size: 30px;
        display:flex;
        gap: 40px;
        list-style: none;
        font-family:'Times New Roman', Times, serif
    }
    li a {
        color: white;
        position: relative;
        text-decoration-line: none;
    }
     nav ul li:hover {
        transition: 0.3s;
        transform: scale(1.5);
     }
   /*section*/

        .marlentina {
          height: 100vh;
      display: flex;

      padding-left: 50px;
      color: white;
      font-size: 30px;
      
      
    }
    
    
  
     


    
   
    
    

    </style>

</head>

        <ul>
