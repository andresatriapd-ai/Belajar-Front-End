<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cafe Kita</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: #3e2723;
      color: white;
    }

    nav h2 {
      margin: 0;
    }

    nav ul {
      display: flex;
      gap: 30px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      position: relative;
      font-weight: 500;
    }

    /* GARIS HOVER */
    nav ul li a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      background: #d7ccc8;
      bottom: -5px;
      left: 0;
      transition: 0.3s;
    }

    nav ul li a:hover::after {
      width: 100%;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 50px;
      margin: 0;
    }

    .hero p {
      margin: 10px 0;
    }

    .hero button {
      padding: 10px 20px;
      border: none;
      background: #6d4c41;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .hero button:hover {
      background: #5d4037;
    }

    /* MENU */
    .menu {
      padding: 50px;
      text-align: center;
    }

    .card {
      display: inline-block;
      margin: 15px;
      padding: 20px 30px;
      background: #efebe9;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      background: #3e2723;
      color: white;
    }

  </style>
</head>
<body>

<nav>
  <h2>CafeKita</h2>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#menu">Menu</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>Nikmati Kopi Terbaik</h1>
  <p>Hangat, nikmat, dan penuh cerita</p>
  <button>Order Now</button>
</section>

<section class="menu">
  <h2 id="menu">Menu Favorit</h2>
  <div class="card">Espresso</div>
  <div class="card">Latte</div>
  <div class="card">Cappuccino</div>
</section>

<footer>
  <p>© 2026 CafeKita</p>
</footer>

</body>
</html>
