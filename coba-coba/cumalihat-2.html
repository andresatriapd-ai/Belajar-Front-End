<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marlentina Design</title>

<style>
body {
    margin: 0;
    background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(logo1.png);
    background-size: cover;
    background-position: center;
    font-family: Arial, sans-serif;
}

/* NAVBAR */
nav {
    opacity: 0.9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    background: rgba(0,0,0,0.5);
}

.logo img {
    height: 60px;
}

/* MENU */
ul {
    display: flex;
    gap: 40px;
    list-style: none;
    font-size: 25px;
}

li a {
    color: white;
    text-decoration: none;
}

nav ul li:hover {
    transform: scale(1.2);
    transition: 0.3s;
}

/* HERO */
.marlentina {
    height: 100vh;
    display: flex;
    align-items: center;
    padding-left: 50px;
    color: white;
    font-size: 40px;
}

#portofolio {
    opacity: 0.8;
    background-color: grey;
    border-radius: 999px;
    display: inline-block;
    padding: 8px 20px;
}

/* PORTOFOLIO */
.portofolio {
    padding: 80px 20px;
    color: white;
    text-align: center;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.card {
    padding: 30px 40px;
    background: white;
    color: black;
    border-radius: 30px;
    min-width: 150px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(50px);
    transition: 0.5s;
}

.card:hover {
    background-color: aqua;
    transform: scale(1.05);
}

.cards.show .card {
    opacity: 1;
    transform: translateY(0);
}

.cards.show .card:nth-child(1) {
    transition-delay: 0.2s;
}

.cards.show .card:nth-child(2) {
    transition-delay: 0.4s;
}

.cards.show .card:nth-child(3) {
    transition-delay: 0.6s;
}

/* AREA GAMBAR */
 
.image-box {
    margin-top: 40px;
    display: none;
    text-align: center;
}

.image-box p {
    margin-top: 15px;
    font-size: 22px;
    color: white;
}

#gallery {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}

#gallery img {
    width: 300px;
    max-width: 90%;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* FOOTER */
.bawah {
    opacity: 0.3;
    background-color: grey;
    padding: 10px;
    text-align: right;
    color: white;
}
</style>
</head>

<body>

<header>
<nav>
    <div class="logo">
        <img src="logolentina.png" alt="Logo">
    </div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#portofolio" onclick="showPortfolio()">Project</a></li>
        <li><a href="#">About</a></li>
    </ul>
</nav>
</header>

<section>
    <div class="marlentina">
        <div>
            <h1>Marlentina Design</h1>
            <p>Design Ruang Impian Anda</p>
        </div>
    </div>
</section>

<section class="portofolio">
    <h2 id="portofolio">Portofolio</h2>

    <div class="cards" id="cards">
        <div class="card" onclick="showImages(['background.png','backgroundd.png'], 'Room Design')">Room</div>
        <div class="card" onclick="showImages(['bedroom1.jpg','bedroom2.jpg'], 'Bedroom Design')">Bedroom</div>
        <div class="card" onclick="showImages(['workspace1.jpg','workspace2.jpg'], 'Workspace Design')">Workspace</div>
    </div>

    <div class="image-box" id="imageBox">
        <p id="imageTitle"></p>
        <div id="gallery"></div>
    </div>
</section>

<script>
function showPortfolio() {
    document.getElementById("cards").classList.add("show");
}

function showImages(images, title) {
    document.getElementById("imageTitle").innerText = title;

    let gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    images.forEach(function(image) {
        gallery.innerHTML += `<img src="${image}" alt="${title}">`;
    });

    document.getElementById("imageBox").style.display = "block";
}
</script>

<footer>
    <div class="bawah">
        <span>
            <ion-icon name="logo-whatsapp"></ion-icon>
            Whatsapp
        </span>
    </div>
</footer>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
