<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import</title>
    <link rel="stylesheet" href="hello.css">
    <style>
        h1 {
            color: brown !important;
        }
        /*important ini bertujuan akan memprioritaskan sesuatu jika lebih dari 1*/
        h1 {
            color: aqua;
        }
        body {
            background-color: grey;
        }
        
    </style>
    <!-- Link tersebut adalah  author stylesheet
     h1 adalah user stylesheet ,ketika double di style tersebut akan dipilih yang terakhir-->

</head>
<body>
    <h1>INI JUDUL</h1>
    <h2>ini sub judul</h2>
</body>
</html>
