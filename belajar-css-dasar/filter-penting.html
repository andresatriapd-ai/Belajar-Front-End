<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter</title>
    <style>
        img {
            width: 500px;
            filter: blur(1px);
        }
        p {
            filter: blur(2px);
        }
    </style>


</head>
<body>
    <img src="/belajar-html-dasar/jez.png" alt="">
    <p>JAWIDJHAWIHDAWDHUIDAHDA</p>
    
</body>
</html>
