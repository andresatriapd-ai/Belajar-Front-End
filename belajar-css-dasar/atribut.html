<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atribut</title>
<style>
    a[target="_blank"]
    {
        color: red;
    }
    p[title~="belajar"] {
        color: green;
    }
    p[title|="belajar"] {
        color: green;
    }
    p[title^="belajar"] {
        color: blue;
    }

    p[title$="belajar"] {
        color: green;
    }
    
   



</style>
 <!--jika memakai bintang akan memilih semua -->
</head>

<body>
    <a href="" target="_blank">Contoh 1</a>
    <a href="">Contoh 2</a>
    <a href="" target="_self">Contoh 3</a>
    <a href="">Contoh 4</a>

    <p title="belajar pemprograman">belajar atribut</p>
    <p title="belajarpemprograman">ini tidak dipilih</p>
    <p title="belajar-pemprograman">ini  dipilih</p>
    <p title="pemprograman belajar">ini dipilih karna di belakang tulisan belajar</p>



    
</body>
</html>
