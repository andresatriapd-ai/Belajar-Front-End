<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        form {
            text-align: right;
        }
        input {
            margin: 10px;
        }
        #username {
            border-style: solid;
        }
        #password {
            border-style: solid;
        }
        #submit {
            border-style: solid;
        }
        #subbmit:hover {
            background-color: green;
            color: red;
        }
           
       
    </style>
</head>
<body>
    <form action="">
        <label for="username">Username :</label>
        <input type="text" required id="username">
        <br>
        <label for="password">Password :</label>
        <input type="password"required id="password">
        <br>
        <input type="submit" id="subbmit">
    </form>
</body>
</html>
