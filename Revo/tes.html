<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <h1 id="title">Hello, World!</h1>
    <h1 class="subtitle">This is a subtitle</h1>
    <h1 class="description">This is a description</h1>

    <div>
        <ul >
            <li ><a href="index.html" target="_self">Item 1</a></li>
            <li><a href="/Testing/index.html" target="_self">Item 2</a></li>
            <li><a href="contact.html" target="_self">Item 3</a></li>
        </ul>
    </div>



    
    <script>
        // Select the element by ID
        const titleElement = document.getElementById('title');
        setTimeout(() => {
            titleElement.textContent = 'Hello, JavaScript!';
        }, 3000);
        console.log(titleElement.textContent); // Output: Hello, World!

        // Select the element by class name
        const subtitleElements = document.getElementsByClassName('subtitle');
        console.log(subtitleElements[0].textContent); // Output: This is a subtitle

        // Select the element by class name
        const descriptionElements = document.getElementsByClassName('description');
        console.log(descriptionElements[0].textContent); // Output: This is a description

        const listItems = document.querySelectorAll('ul li');
        console.log(listItems[0].textContent); // Output: Item 1
        console.log(listItems[1].textContent); // Output: Item 2
        console.log(listItems[2].textContent); // Output: Item 3
    </script>
</body>
</html>
