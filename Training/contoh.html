<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh HTML CSS JavaScript</title>

  <style>
    /* CSS: mengatur tampilan */
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      padding-top: 80px;
    }

    .kotak {
      background-color: white;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      color: #2563eb;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e40af;
    }
  </style>
</head>
<body>

  <!-- HTML: kerangka/isi halaman -->
  <div class="kotak">
    <h1 id="judul">Halo!</h1>
    <p>Ini contoh halaman sederhana.</p>
    <button onclick="ubahTeks()">Klik Saya</button>
  </div>

  <script>
    // JavaScript: membuat halaman interaktif
    function ubahTeks() {
      document.getElementById("judul").innerText = "Teks beruuubah!";
    }
  </script>

</body>
</html>
