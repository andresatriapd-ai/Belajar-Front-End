<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box"></div>
<button onclick="gerakkanKotak()">Gerakkan</button>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<script>
  // 1. Variabel
  let jarak = 200;

  // 2. Function
  function gerakkanKotak() {
    // 3. Library
    gsap.to(".box", {
      x: jarak,
      duration: 1
    });
  }
</script>
    
</body>
</html>
