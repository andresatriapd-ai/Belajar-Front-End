<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Background changer</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">
        
        <div class="title">Pilih Warna</div>
         <div class="box">
        <div class="circle red"></div>
        <div class="circle blue"></div>
        <div class="circle green"></div>
        <div class="circle black"></div>
        <button id="reset-button" type="button">Reset</button>
        </div>
    </div>
   

    <script>
        const circles = document.querySelectorAll('.circle');
        const changeColorTitle = document.querySelector('.title');
        circles.forEach((circle) => {
            circle.addEventListener('click', () => {
                const color = circle.classList[1];
                document.body.style.backgroundColor = color;
                changeColorTitle.style.color = color === 'black' ? 'white' : 'black';
            });
        });

        const resetButton = document.querySelector('#reset-button');
        resetButton.addEventListener('click', () => {
            document.body.style.backgroundColor = '';
            changeColorTitle.style.color = '';
        });

    </script>
    
</body>
</html>
