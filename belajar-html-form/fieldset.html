<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Set Grub</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Identitas</legend>
            <label for="nama">Nama :</label>
            <input type="text" name="nama" id="nama" placeholder="Andre Satria"> <br>

            <label for="email">Email :</label>
            <input type="email" name="email" id="email" placeholder="andresatria@gmail.com"> <br>
            
            <label for="telephone">Telephone:</label>
            <input type="tel" name="telephone" id="telephone" placeholder="+62"> <br>
        </fieldset> 

        <fieldset>
            <legend>Alamat</legend>
            <label for="jalan">Jalan :</label>
            <input type="text" name="jalan" id="jalan"> <br>

            <label for="kota">Kota :</label>
            <input type="text" name="kota" id="kota"> <br>

            <label for="provinsi">Provinsi</label>
            <input type="text" name="provinsi" id="provinsi">

        </fieldset>

    </form>
    
</body>
</html>
