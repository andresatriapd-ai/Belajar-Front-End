<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Position</title>
    <style>
        .content {
            background-color: aqua;
            width: 200px;
            height: 200px;
            display: inline-block;
        }
        .conten2 {
            background-color: brown;
            position: relative;
            top: 25px;
            left: 50px;
        }

    </style>
</head>
<body>
    <div class="content conten1">
        <h1>Content1</h1>
    </div>

    <div class="content conten2">
        <h1>Content2</h1>
    </div>

    <div class="content conten3">
        <h1>Content3</h1>
    </div>
    
</body>
</html>
