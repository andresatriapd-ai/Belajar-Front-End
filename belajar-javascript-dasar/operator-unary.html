<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let result = 1;
        document.writeln ("<p> "+result+"  </p>")

        result --; // result adalah 1 dan dikurangai 1 menjadi nol
        document.writeln ("<p> "+result+"  </p>")
        
        result++ ; // result dari nol menjadi di tambahkan 1 
         document.writeln ("<p> "+result+"  </p>")

    </script>
    
</body>
</html>
