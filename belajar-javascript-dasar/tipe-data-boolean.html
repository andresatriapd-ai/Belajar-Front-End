<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipe data Boolean</title>
</head>
<body>
    <script>
        document.writeln (true) // benar
        document.writeln ("</br>") 
        document.writeln (false)  //salah
        document.writeln ("apa")
        
    </script>
    
</body>
</html>
