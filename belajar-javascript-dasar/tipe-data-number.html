<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipe Data Number</title>
</head>
<body>
    <script>
        // bilangan bulat
        document.writeln(100);
        document.writeln ("</br>");
        // bilangan pecahan
        document.writeln(100.200);

        document.writeln( 0b11111010 )
        document.writeln
    </script>
    
</body>
