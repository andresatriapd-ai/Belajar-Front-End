<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Table</title>

</head>

<body>
    <h1>belajar Table</h1>

    <table style="border: 1px solid red;">
        <colgroup>
            <col span="2" style="background-color: yellowgreen;">
            <col style="background-color: aqua;"> 
        </colgroup>
        <thead>
            <tr>
                <th colspan="2">Nama</th>
                <th>Nilai</th>

            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Andre </td>
                <td>Satria</td>
                <td>50</td>
            </tr>
            
            <tr>
                <td>Putra</td>
                <td>Dwifa</td>
                <td>50</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <td rowspan="2">Total</td>
                <td>Total</td>
                <td>100</td>
            </tr>

            <tr>
                
                <td>Nilai Rata Rata</td>
                <td> 75 </td>
            </tr>
        </tfoot>
        <tr>
            <td>ini </td>
            <td> belum tau</td>
        </tr>

    </table>
    
</body>
</html>
