<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Table</title>
</head>
<body>
    <h1>Belajar Table</h1>
    
    <table style="border: 1px solid red;">
        <colgroup>
        <col span="2" style="background-color: yellowgreen;">
        <col style="background-color: aqua;">
    </colgroup>
        <thead>
            <tr>
                <th>Nama Depan</th>
                <th>Nama Belakang</th>
                <th>nilai</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Andre</td>
                <td>Satria</td>
                <td>50</td>
            </tr>

            <tr> 
                <td>putra</td>
                <td>dwifa</td>
                <td>60</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td></td>
                <td>total</td>
                <td>110</td>

            </tr>
        </tfoot>

    </table>
</body>
</html>
